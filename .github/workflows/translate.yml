name: Translate site

# Rebuilds every translated copy (/fr/, /es/, /de/, ... - see "order" in i18n/config.json)
# from the English pages whenever an English page changes. Only new or edited strings
# are sent for translation; everything else comes from i18n/cache/. The result is
# committed back to main, and Netlify deploys it.
#
# Adding a language translates the whole site into it from scratch, which is a long
# run (roughly 15-30 minutes per language). If a run fails or times out, the strings it
# did translate (i18n/cache/) are still committed, but no pages are, so the site never
# links to a half-built language. Re-run the workflow and it picks up where it stopped
# instead of paying for the same strings again.
#
# Needs one repo secret: ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'i18n/config.json'
      - 'tools/i18n/**'
      - 'assets/*-widget.js'
      - '.github/workflows/translate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-site
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translate and render
        # A step timeout, not just the job's, so the save step below still runs.
        timeout-minutes: 280
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/i18n/build.py --workers 6
      - name: Commit translations
        run: |
          git config user.name "wailea-translate-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LANGS=$(python3 -c "import json; c = json.load(open('i18n/config.json')); print(' '.join(l for l in c['order'] if l != c['default'] and __import__('os').path.isdir(l)))")
          git add -A $LANGS i18n sitemap-i18n.xml robots.txt *.html
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git commit -m "i18n: rebuild translated pages"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Save translation progress
        if: ${{ failure() }}
        run: |
          git config user.name "wailea-translate-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A i18n/cache
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "i18n: save partial translation progress"
          git stash --include-untracked
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
